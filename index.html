<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <title>Projecto</title>
        
         <style>
             *{
                 padding: 0;
                 margin: 0;
                 font-family: 'Courier New';
                 font-size: 2rem
             }
                 /*Sempre que quero unificar o css chamo a tag style dentro do head e denoto uma classe na tag que pretendo estilizar*/
             .luisa{
                 color: #17180f;
                
             }
        </style>
    </head>
    <body>
        
        <!--Criei o olá mundo--> 
        <h1 class="luisa" id="luisa">
       Olá mundo
    </h1>
        
        <script>
            /Sempre que pretendo unificar o html com o javascript devo definir esta tag no body e quando quero aplicar a funacao a ela basta trazer o se id/
            document.getElementById.apply(luisa)
    
        </script>
    </body>
</html>
